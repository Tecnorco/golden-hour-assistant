[project]
name = "golden-hour-assistant"
version = "0.1.0"
description = "Email-first AI assistant for a small photography studio (capstone)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.1,<4",
    "mcp>=2.3,<3",
    "streamlit>=1.60",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls the real Gemini API (needs GEMINI_API_KEY); skipped by default"]
addopts = "-m 'not live'"
